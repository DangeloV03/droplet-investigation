# Slurm settings for json_runner.py --slurm
# Aligned with flex-investigation (partition, mem, conda setup, %j logs).
#
# WALLTIME: set time_minutes only. Batch scripts emit #SBATCH --time=2880
# (integer minutes = 2 days). Do NOT use HH:MM:SS in #SBATCH lines — Della
# accepts --time=12:00:00 on the CLI but rejects it inside script files.
# #SBATCH directives must precede the first command line in the batch script
# or Slurm ignores them (see poster_run.py::_build_batch_script).

job_name: droplet_sim
cpus_per_task: 1
mem: 8G
time_minutes: 2880
partition: cpu
qos: medium
# account: your_account   # uncomment if required

report_dir: /home/vd7294/slurm_reports
output: "/home/vd7294/slurm_reports/%j.out"
error: "/home/vd7294/slurm_reports/%j.err"

setup_cmds:
  - "module load anaconda3/2024.10"
  - "source \"$(conda info --base)/etc/profile.d/conda.sh\""
  - "conda activate lattice"
  - "export LD_LIBRARY_PATH=\"$CONDA_PREFIX/lib:${LD_LIBRARY_PATH:-}\""
  - "export PYTHONUNBUFFERED=1"

project_root: "/scratch/gpfs/WJACOBS/vd7294/droplet-investigation"
